name: Clean up stale branches

on:
  schedule:
    - cron: "0 5 * * 0" # Every Sunday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-stale-branches:
    name: Delete branches with no activity for 60+ days
    runs-on: ubuntu-latest

    steps:
      - name: Delete stale branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STALE_DAYS: 60
        run: |
          set -euo pipefail

          OWNER="${REPO%/*}"
          REPO_NAME="${REPO#*/}"
          CUTOFF_TS=$(date -u -d "$STALE_DAYS days ago" +%s)

          # Branches to never delete
          PROTECTED_REGEX="^(main|master|develop|release/.*)$"

          echo "Scanning for branches with no commits in the last $STALE_DAYS days..."

          page=1
          deleted=0
          while :; do
            RESPONSE=$(curl -sS \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO_NAME/branches?per_page=100&page=$page")

            COUNT=$(echo "$RESPONSE" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            echo "$RESPONSE" | jq -r '.[].name' | while read -r BRANCH; do
              # Skip protected branches
              if [[ "$BRANCH" =~ $PROTECTED_REGEX ]]; then
                continue
              fi

              # Get the latest commit date for the branch
              COMMIT_INFO=$(curl -sS \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$OWNER/$REPO_NAME/commits?sha=$BRANCH&per_page=1")

              LAST_COMMIT_DATE=$(echo "$COMMIT_INFO" | jq -r '.[0].commit.committer.date // empty')

              if [ -z "$LAST_COMMIT_DATE" ]; then
                echo "  ⚠ Could not get commit date for $BRANCH (skipping)."
                continue
              fi

              LAST_COMMIT_TS=$(date -d "$LAST_COMMIT_DATE" +%s)

              if [ "$LAST_COMMIT_TS" -lt "$CUTOFF_TS" ]; then
                # Check for open PRs before deleting
                OPEN_PRS=$(curl -sS \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$OWNER/$REPO_NAME/pulls?state=open&head=$OWNER:$BRANCH&per_page=1")

                OPEN_PR_COUNT=$(echo "$OPEN_PRS" | jq 'length')
                if [ "$OPEN_PR_COUNT" -gt 0 ]; then
                  echo "  → $BRANCH has open PRs (skipping)."
                  continue
                fi

                echo "  → Deleting stale branch: $BRANCH (last commit: $LAST_COMMIT_DATE)"
                DELETE_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
                  -X DELETE \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$OWNER/$REPO_NAME/git/refs/heads/$BRANCH")

                if [ "$DELETE_STATUS" -eq 204 ]; then
                  echo "  ✓ Deleted $BRANCH"
                  deleted=$((deleted + 1))
                else
                  echo "  ✗ Failed to delete $BRANCH (HTTP $DELETE_STATUS)"
                fi
              fi
            done

            page=$((page + 1))
          done

          echo "Done. Deleted $deleted stale branch(es)."
